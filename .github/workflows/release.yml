name: Release

# Wird durch ein Versions-Tag ausgelöst:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub Release anlegen
  packages: write   # Docker-Image nach ghcr.io

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/razafindriatsara/radius-rs

jobs:
  binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Version im Tag und in Cargo.toml vergleichen
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "v$cargo_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml (v$cargo_version)"
            exit 1
          fi

      - name: Bauen
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Paketieren (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="radius-rs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/{radius-rs,radius-client} "dist/$name/"
          cp README.md LICENSE CHANGELOG.md config.example.toml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          "dist/$name/radius-rs" --version

      - name: Paketieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "radius-rs-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/radius-rs.exe, target/${{ matrix.target }}/release/radius-client.exe, README.md, LICENSE, CHANGELOG.md, config.example.toml "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
          & "dist/$name/radius-rs.exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Installation

          Archiv für dein System herunterladen, entpacken, \`config.example.toml\` nach \`config.toml\` kopieren und \`radius-rs config.toml\` starten.

          Oder mit Docker:

          \`\`\`bash
          docker run --rm -p 1812:1812/udp -p 1813:1813/udp ${IMAGE}:${version}
          \`\`\`

          Prüfsummen liegen jeweils als \`.sha256\`-Datei daneben.
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: radius-rs ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  docker:
    name: Docker-Image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=radius-rs
            org.opencontainers.image.description=Schlanker, sicherheitsorientierter RADIUS-Server in Rust
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image testen
        run: |
          docker run -d --name radius -p 1812:1812/udp "${IMAGE}:${GITHUB_REF_NAME#v}"
          sleep 3
          docker exec radius radius-client status 127.0.0.1:1812 testing123
          docker exec radius radius-rs --version
          docker rm -f radius
