name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Tests
        run: cargo test

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: shellcheck
        run: shellcheck scripts/*.sh

  interop:
    name: Interop mit FreeRADIUS (radclient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: radclient installieren
        run: sudo apt-get update && sudo apt-get install -y freeradius-utils
      - name: Interop-Tests
        run: ./scripts/interop-freeradius.sh

  docker:
    name: Docker-Image & Compose-Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: radclient installieren
        run: sudo apt-get update && sudo apt-get install -y freeradius-utils
      - name: Image bauen
        run: docker compose build
      - name: Server starten (wartet auf Health Check)
        run: docker compose up -d --wait radius
      - name: Demo-Client
        run: docker compose run --rm demo
      - name: Eingangsportal
        run: |
          docker compose up -d portal
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -d 'username=martin&password=geheim123' http://127.0.0.1:8080/login)
          test "$code" = "303"
          code=$(curl -s -o /dev/null -w '%{http_code}' -d 'username=martin&password=falsch' http://127.0.0.1:8080/login)
          test "$code" = "401"
      - name: Admin-Oberfläche (Trennen per RFC 5176)
        run: ./scripts/admin-smoke.sh
      - name: radclient gegen den Container
        run: SERVER=127.0.0.1 AUTH_PORT=1812 ACCT_PORT=1813 SKIP_START=1 ./scripts/interop-freeradius.sh
      - name: Logs und Aufräumen
        if: always()
        run: |
          docker compose logs radius portal
          docker compose down -v
