[package]
name = "radius-rs"
version = "0.1.0"
edition = "2024"
default-run = "radius-rs"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
hmac = "0.13.0"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal", "time"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
proptest = "1.12.0"

# Argon2 ist im Debug-Build sehr langsam (ca. 0,5 s pro Prüfung). Krypto-Crates auch im Dev-Profil optimieren.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
