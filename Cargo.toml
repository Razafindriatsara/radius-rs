[package]
name = "radius-rs"
version = "0.2.0"
edition = "2024"
description = "Schlanker, sicherheitsorientierter RADIUS-Server (RFC 2865/2866) in Rust"
license = "MIT"
repository = "https://github.com/Razafindriatsara/radius-rs"
default-run = "radius-rs"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = "0.8.9"
getrandom = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal", "time"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
proptest = "1.12.0"
tower = { version = "0.5.3", features = ["util"] }

# Argon2 ist im Debug-Build sehr langsam (ca. 0,5 s pro Prüfung). Krypto-Crates auch im Dev-Profil optimieren.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
